name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'sw.js'
      - 'manifest.webmanifest'
      - 'icon-192.png'
      - 'icon-512.png'
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Bundle the web build into the APK
        run: |
          set -euo pipefail
          mkdir -p android/app/src/main/assets
          cp index.html sw.js manifest.webmanifest android/app/src/main/assets/
          curl -fsSL https://unpkg.com/three@0.160.0/build/three.module.js \
            -o android/app/src/main/assets/three.module.js
          # serve three.js from inside the APK so it runs with no network at all
          sed -i 's#https://unpkg.com/three@0.160.0/build/three.module.js#./three.module.js#' \
            android/app/src/main/assets/index.html
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi
          cp icon-192.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          ls -lh android/app/src/main/assets

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: neon-siege-3d-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 90
